# Speakr behind Caddy with a username and password, transcribing locally with WhisperX.
# Everything is stored next to this file:
#   ./data/uploads   -> uploaded audio
#   ./data/instance  -> database, settings, generated secret key
#   volume speakr-models -> Whisper, alignment and speaker models (Hugging Face cache)
#   ./caddy          -> Caddyfile, password file, certificates
name: speakr

services:
  app:
    # Speakr image plus speakr-patches/ (adds the Chars/s column to the ASR editor)
    build:
      context: ./speakr-patches
      args:
        - SPEAKR_VERSION=${SPEAKR_VERSION:-lite}
    image: speakr-patched:${SPEAKR_VERSION:-lite}
    container_name: speakr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOG_LEVEL=ERROR
      - ASR_BASE_URL=http://asr-punctuate:9000
    expose:
      - "8899"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/instance:/data/instance
    depends_on:
      - asr-punctuate

  # Turns spoken "period", "comma", "new line" in the transcript into . , and line breaks
  # (scripts/spoken_punctuation.py). Speakr talks to this instead of WhisperX directly.
  asr-punctuate:
    build:
      context: .
      dockerfile: asr-punctuate/Dockerfile
    image: speakr-asr-punctuate:local
    container_name: speakr-asr-punctuate
    restart: unless-stopped
    environment:
      - UPSTREAM=http://whisperx-asr:9000
    expose:
      - "9000"
    depends_on:
      - whisperx-asr

  # Local transcription. CPU by default; see docker-compose.gpu.yml for NVIDIA GPUs.
  whisperx-asr:
    image: learnedmachine/whisperx-asr-service:${WHISPERX_VERSION:-latest}
    container_name: speakr-whisperx
    restart: unless-stopped
    shm_size: "2g"
    expose:
      - "9000"
    environment:
      - PYTHONWARNINGS=ignore::UserWarning
      - DEVICE=${WHISPERX_DEVICE:-cpu}
      - COMPUTE_TYPE=${WHISPERX_COMPUTE_TYPE:-int8}
      - BATCH_SIZE=${WHISPERX_BATCH_SIZE:-2}
      - HF_TOKEN=${HF_TOKEN:-}
      - CACHE_DIR=/.cache
      - HF_HOME=/.cache
      - NLTK_DATA=/.cache/nltk_data
      - PRELOAD_MODEL=${WHISPER_MODEL:-small}
      - ALLOWED_MODELS=${WHISPER_ALLOWED_MODELS:-}
      - MAX_FILE_SIZE_MB=1000
    volumes:
      # Named volume: Whisper, alignment and speaker models; survives container recreation
      - speakr-models:/.cache

  caddy:
    image: caddy:${CADDY_VERSION:-2.10}
    container_name: speakr-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8086}:80"
      - "${HTTPS_PORT:-8446}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      - PUBLIC_HTTPS_PORT=${HTTPS_PORT:-8446}
      - UPSTREAM=app:8899
    volumes:
      # Named volume filled by `make caddy-sync` (run by make start and make password),
      # because some Docker daemons cannot read single bind-mounted files
      - caddy-etc:/etc/caddy:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - app

volumes:
  caddy-etc:
    name: speakr-caddy-etc
  speakr-models:
    name: speakr-models
    external: true   # created by make setup
